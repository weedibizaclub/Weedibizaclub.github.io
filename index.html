<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace Weed Club – Cannabis Social Club Ibiza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #F8FAF6;
    --off-white: #EEF3EB;
    --green-deep: #1A3A1F;
    --green-mid: #2D5E34;
    --green-light: #4A8C53;
    --green-pale: #A8C9A1;
    --green-mint: #C8E6C0;
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --charcoal: #1C1C1C;
    --text-muted: #5A6B57;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--white);
    color: var(--charcoal);
    overflow-x: hidden;
  }

  /* ─── CURSOR ─── */
  * { cursor: none; }
  .cursor {
    width: 10px; height: 10px;
    background: var(--green-mid);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform .15s ease, width .2s, height .2s, background .2s;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1.5px solid var(--green-light);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform .35s ease;
    opacity: .7;
  }
  @media (hover: none) { .cursor, .cursor-ring { display: none; } * { cursor: auto; } }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    padding: 22px 60px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(248,250,246,0.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(74,140,83,0.12);
    transition: padding .3s ease, box-shadow .3s ease;
  }
  nav.scrolled {
    padding: 14px 60px;
    box-shadow: 0 4px 30px rgba(26,58,31,0.08);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none;
  }
  .logo-leaf {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    border-radius: 50% 5px 50% 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(45,94,52,0.3);
  }
  .logo-leaf svg { width: 22px; height: 22px; fill: white; }
  .logo-text { line-height: 1; }
  .logo-text strong {
    display: block; font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem; font-weight: 600; color: var(--green-deep);
    letter-spacing: 0.03em;
  }
  .logo-text span {
    font-size: 0.62rem; letter-spacing: 0.22em; color: var(--gold);
    text-transform: uppercase; font-weight: 500;
  }
  .nav-links {
    display: flex; align-items: center; gap: 36px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none; font-size: 0.82rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 500;
    position: relative; transition: color .25s;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -3px; left: 0;
    width: 0; height: 1.5px; background: var(--green-mid);
    transition: width .3s ease;
  }
  .nav-links a:hover { color: var(--green-deep); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    background: var(--green-mid);
    color: white !important;
    padding: 10px 24px !important;
    border-radius: 2px !important;
    letter-spacing: 0.12em !important;
    transition: background .25s, transform .2s !important;
  }
  .nav-cta:hover { background: var(--green-deep) !important; transform: translateY(-1px); }
  .nav-cta::after { display: none !important; }
  .nav-burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; padding: 4px; }
  .nav-burger span { display: block; width: 24px; height: 2px; background: var(--green-deep); transition: .3s; }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 120px 40px 80px;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(74,140,83,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 15% 30%, rgba(168,201,161,0.12) 0%, transparent 50%),
      radial-gradient(ellipse 50% 50% at 85% 20%, rgba(201,168,76,0.06) 0%, transparent 50%);
    background-color: var(--white);
  }
  .hero-pattern {
    position: absolute; inset: 0; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%232D5E34' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  /* Floating leaf decorations */
  .hero-leaf {
    position: absolute;
    opacity: 0.06;
    animation: floatLeaf 8s ease-in-out infinite;
  }
  .hero-leaf:nth-child(1) { top: 12%; left: 8%; font-size: 120px; animation-delay: 0s; }
  .hero-leaf:nth-child(2) { top: 20%; right: 6%; font-size: 80px; animation-delay: -3s; }
  .hero-leaf:nth-child(3) { bottom: 18%; left: 5%; font-size: 60px; animation-delay: -5s; }
  .hero-leaf:nth-child(4) { bottom: 25%; right: 10%; font-size: 100px; animation-delay: -1.5s; }
  @keyframes floatLeaf {
    0%,100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--green-pale);
    padding: 7px 18px; border-radius: 40px;
    font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--green-mid); font-weight: 500;
    margin-bottom: 28px;
    animation: fadeUp .8s ease both;
    background: rgba(168,201,161,0.1);
  }
  .hero-badge::before {
    content: ''; width: 6px; height: 6px;
    background: var(--green-light); border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.2rem, 8vw, 7rem);
    font-weight: 300; line-height: 1.04;
    color: var(--green-deep);
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    animation: fadeUp .9s .1s ease both;
  }
  .hero h1 em { font-style: italic; color: var(--green-mid); }
  .hero h1 .gold { color: var(--gold); }
  .hero-sub {
    max-width: 560px;
    font-size: 1.05rem; line-height: 1.75;
    color: var(--text-muted); font-weight: 300;
    margin-bottom: 48px;
    animation: fadeUp 1s .2s ease both;
  }
  .hero-actions {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    animation: fadeUp 1s .35s ease both;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    color: white; padding: 16px 36px;
    text-decoration: none; font-size: 0.8rem;
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
    border-radius: 2px;
    box-shadow: 0 8px 30px rgba(45,94,52,0.28);
    transition: transform .25s, box-shadow .25s;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(45,94,52,0.36); }
  .btn-secondary {
    border: 1.5px solid var(--green-mid);
    color: var(--green-mid); padding: 16px 36px;
    text-decoration: none; font-size: 0.8rem;
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
    border-radius: 2px; background: transparent;
    transition: background .25s, color .25s, transform .25s;
  }
  .btn-secondary:hover {
    background: var(--green-mid); color: white;
    transform: translateY(-2px);
  }
  .hero-scroll {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--green-pale); font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: fadeUp 1s .6s ease both;
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, var(--green-pale), transparent);
    animation: scrollAnim 2s ease-in-out infinite;
  }
  @keyframes scrollAnim { 0%{opacity:0;transform:scaleY(0);transform-origin:top} 50%{opacity:1;transform:scaleY(1)} 100%{opacity:0;transform:scaleY(0);transform-origin:bottom} }

  @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

  /* ─── STATS BAR ─── */
  .stats-bar {
    background: var(--green-deep);
    padding: 36px 60px;
    display: flex; justify-content: center;
    gap: 0;
  }
  .stat-item {
    text-align: center; flex: 1; max-width: 200px;
    padding: 0 30px;
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .stat-item:last-child { border-right: none; }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem; font-weight: 600; color: var(--gold-light);
    display: block; line-height: 1;
  }
  .stat-label {
    font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(200,230,192,0.7); margin-top: 6px;
  }

  /* ─── SECTION TEMPLATE ─── */
  section { padding: 110px 60px; }
  .section-tag {
    font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--green-light); font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .section-tag::before {
    content: ''; display: block; width: 30px; height: 1px;
    background: var(--green-light);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 4vw, 3.8rem);
    font-weight: 300; line-height: 1.15;
    color: var(--green-deep);
  }
  .section-title em { font-style: italic; }

  /* ─── ABOUT ─── */
  .about {
    background: var(--off-white);
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
    align-items: center;
  }
  .about-img {
    position: relative; border-radius: 4px; overflow: hidden;
    aspect-ratio: 4/5;
  }
  .about-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .8s ease;
  }
  .about-img:hover img { transform: scale(1.04); }
  .about-img-decor {
    position: absolute; bottom: -20px; right: -20px;
    width: 120px; height: 120px;
    border: 2px solid var(--gold);
    border-radius: 4px; z-index: -1;
    opacity: .4;
  }
  .about-img-badge {
    position: absolute; top: 24px; left: 24px;
    background: rgba(26,58,31,0.88);
    backdrop-filter: blur(10px);
    color: white; padding: 12px 18px; border-radius: 3px;
    font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
  }
  .about-img-badge span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 600; color: var(--gold-light);
    display: block; line-height: 1;
  }
  .about-content { padding: 20px 0; }
  .about-content .section-title { margin-bottom: 24px; }
  .about-content p {
    font-size: 1rem; line-height: 1.85; color: var(--text-muted);
    font-weight: 300; margin-bottom: 18px;
  }
  .about-values {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-top: 36px;
  }
  .value-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px; background: white; border-radius: 4px;
    border-left: 3px solid var(--green-mint);
    transition: border-color .3s, transform .3s;
  }
  .value-item:hover { border-color: var(--green-mid); transform: translateX(4px); }
  .value-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .value-text strong {
    display: block; font-size: 0.78rem; font-weight: 600;
    color: var(--green-deep); letter-spacing: 0.04em; margin-bottom: 3px;
  }
  .value-text span { font-size: 0.75rem; color: var(--text-muted); }

  /* ─── PILLARS ─── */
  .pillars { background: white; text-align: center; }
  .pillars-header { max-width: 600px; margin: 0 auto 60px; }
  .pillars-header .section-tag { justify-content: center; }
  .pillars-header .section-tag::before { display: none; }
  .pillars-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    background: var(--green-mint);
    border: 2px solid var(--green-mint);
    border-radius: 6px; overflow: hidden;
    max-width: 1000px; margin: 0 auto;
  }
  .pillar {
    background: white; padding: 50px 36px;
    transition: background .3s, transform .3s;
    position: relative; overflow: hidden;
  }
  .pillar::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, var(--green-mid), var(--green-light));
    transform: scaleX(0); transform-origin: left;
    transition: transform .4s ease;
  }
  .pillar:hover { background: var(--off-white); }
  .pillar:hover::before { transform: scaleX(1); }
  .pillar-icon {
    font-size: 2.2rem; margin-bottom: 20px;
    display: block;
  }
  .pillar h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem; font-weight: 400;
    color: var(--green-deep); margin-bottom: 14px;
  }
  .pillar p {
    font-size: 0.88rem; line-height: 1.8;
    color: var(--text-muted); font-weight: 300;
  }

  /* ─── EXPERIENCE ─── */
  .experience { background: var(--green-deep); color: white; }
  .experience .section-tag { color: var(--green-mint); }
  .experience .section-tag::before { background: var(--green-mint); }
  .experience .section-title { color: white; }
  .experience .section-title em { color: var(--gold-light); }
  .exp-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
    align-items: center; margin-top: 50px;
  }
  .exp-list { display: flex; flex-direction: column; gap: 0; }
  .exp-item {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 24px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: padding-left .3s;
  }
  .exp-item:hover { padding-left: 8px; }
  .exp-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; color: var(--gold); opacity: .6;
    min-width: 32px; margin-top: 2px;
  }
  .exp-content strong {
    display: block; font-size: 1rem; font-weight: 500;
    color: white; margin-bottom: 6px;
  }
  .exp-content p { font-size: 0.85rem; color: rgba(200,230,192,0.65); line-height: 1.7; }
  .exp-visual {
    position: relative; border-radius: 4px; overflow: hidden;
    aspect-ratio: 4/5;
  }
  .exp-visual img { width: 100%; height: 100%; object-fit: cover; }
  .exp-visual-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(26,58,31,0.7) 0%, transparent 50%);
  }
  .exp-visual-text {
    position: absolute; bottom: 28px; left: 28px; right: 28px;
  }
  .exp-visual-text p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-style: italic;
    color: white; line-height: 1.4;
  }
  .exp-visual-text span {
    font-size: 0.7rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--gold-light);
    display: block; margin-top: 8px;
  }

  /* ─── FORM ─── */
  .contact { background: var(--off-white); }
  .contact-inner {
    max-width: 760px; margin: 0 auto; text-align: center;
  }
  .contact-inner .section-tag { justify-content: center; }
  .contact-inner .section-tag::before { display: none; }
  .contact-inner .section-title { margin-bottom: 12px; }
  .contact-inner > p {
    font-size: 0.95rem; color: var(--text-muted); margin-bottom: 48px;
    line-height: 1.7;
  }
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    text-align: left;
  }
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1/-1; }
  .form-group label {
    font-size: 0.72rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--green-deep); font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    border: 1.5px solid rgba(74,140,83,0.2);
    background: white; border-radius: 3px;
    padding: 14px 18px; font-family: 'Outfit', sans-serif;
    font-size: 0.9rem; color: var(--charcoal);
    transition: border-color .25s, box-shadow .25s;
    outline: none;
    -webkit-appearance: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--green-mid);
    box-shadow: 0 0 0 3px rgba(74,140,83,0.08);
  }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .form-submit {
    margin-top: 28px;
    display: flex; justify-content: center;
  }
  .btn-form {
    background: linear-gradient(135deg, var(--green-mid), var(--green-deep));
    color: white; padding: 16px 50px; border: none;
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem; letter-spacing: 0.16em;
    text-transform: uppercase; font-weight: 500;
    border-radius: 2px; cursor: none;
    box-shadow: 0 8px 28px rgba(45,94,52,0.25);
    transition: transform .25s, box-shadow .25s;
  }
  .btn-form:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(45,94,52,0.35);
  }
  .form-success {
    display: none; padding: 20px; background: rgba(74,140,83,0.1);
    border: 1px solid var(--green-pale); border-radius: 4px;
    color: var(--green-deep); font-size: 0.9rem; margin-top: 20px;
  }

  /* ─── MAP + LOCATION ─── */
  .location { background: white; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .location-info {
    padding: 80px 70px; display: flex; flex-direction: column;
    justify-content: center;
  }
  .location-info .section-title { margin-bottom: 30px; }
  .location-detail {
    display: flex; gap: 16px; align-items: flex-start;
    margin-bottom: 24px;
  }
  .loc-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0; margin-top: 2px;
  }
  .loc-text strong {
    display: block; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--green-deep); margin-bottom: 4px;
  }
  .loc-text p, .loc-text a {
    font-size: 0.9rem; color: var(--text-muted);
    text-decoration: none; transition: color .25s;
  }
  .loc-text a:hover { color: var(--green-mid); }
  .hours-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 8px;
  }
  .hours-row {
    display: flex; justify-content: space-between;
    font-size: 0.82rem; color: var(--text-muted);
    padding: 6px 0; border-bottom: 1px solid rgba(74,140,83,0.1);
  }
  .hours-row span:last-child { color: var(--green-mid); font-weight: 500; }
  .location-map {
    background: var(--off-white);
    min-height: 500px; position: relative; overflow: hidden;
  }
  .location-map iframe {
    width: 100%; height: 100%; border: none;
    min-height: 500px; filter: saturate(1.1) brightness(1.02);
  }

  /* ─── REVIEWS ─── */
  .reviews {
    background: linear-gradient(135deg, var(--green-deep) 0%, #0f2312 100%);
    color: white; text-align: center;
  }
  .reviews .section-tag { color: var(--green-mint); justify-content: center; }
  .reviews .section-tag::before { display: none; }
  .reviews .section-title { color: white; margin-bottom: 10px; }
  .reviews .section-title em { color: var(--gold-light); }
  .reviews-sub {
    font-size: 0.9rem; color: rgba(200,230,192,0.6); margin-bottom: 50px;
    display: flex; align-items: center; justify-cont
